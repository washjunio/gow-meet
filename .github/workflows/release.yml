name: release
# Tag v<versão> (a mesma do src-tauri/tauri.conf.json) gera o .dmg do macOS e o instalador
# do Windows e publica os dois numa Release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            bundles: app,dmg
            files: target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: nsis
            files: target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      # Assinatura ad-hoc no macOS: sem certificado Apple, quem baixa libera o app uma vez
      # em Ajustes > Privacidade. No Windows o instalador sai sem assinatura (aviso do SmartScreen).
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
      - name: Tag confere com a versão do app
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, app $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: bundles, merge-multiple: true }
      - name: Publica a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bundles/* --repo "$GITHUB_REPOSITORY" \
            --title "GOW Meet $GITHUB_REF_NAME" --generate-notes
