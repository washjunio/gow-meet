name: release
# Tag v<versão> (a mesma do src-tauri/tauri.conf.json) gera o .dmg do macOS e publica numa Release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-14
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      # Assinatura ad-hoc: sem certificado Apple, quem baixa libera o app uma vez em Ajustes > Privacidade.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
      - name: Tag confere com a versão do app
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, app $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx tauri build --bundles app,dmg
      - name: Publica a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/release/bundle/dmg/*.dmg --title "gow-meet $GITHUB_REF_NAME" --generate-notes
